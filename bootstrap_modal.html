<html>

<head>
    <title>Modal Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    
    <nav class="navbar navbar-expand-sm bg-dark">
        <div class="container-fluid">
            
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-white" href="bootstrap_table.html">Table Page</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="bootstrap.html">Bootstrap Example</a>
                </li>
            </ul>
                    
        </div>
    </nav>
    
    <div class="container mt-5">

        <div class="alert alert-warning text-danger alert-dismissible">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            Alert!!! The website is down
        </div>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">Open Modal</button>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myLogin">Login</button>
    </div>

    <!-- Modal -->
    <div class="modal" id="myModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- modal header -->
                <div class="modal-header">
                    <h3>Modal</h3>
                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <!-- modal body -->
                <div class="modal-body">
                    <p>Alert!!! You got an error.</p>
                </div>

                <!-- model footer -->
                <div class="modal-footer">
                    <button class="btn btn-primary" type="button" data-bs-dismiss="modal">Close</button>
                </div>

            </div>
        </div>
    </div>


    <div class="modal" id="myLogin">
        <div class="modal-dialog">
            <div class="modal-content">
                <!-- modal header -->
                <div class="modal-header">
                    <h3>Login</h3>
                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>

                <!-- modal body -->
                <div class="modal-body">
                    
                    <div class="input-group mb-3 input-group-sm">
                        <label style="margin-right: 10px;">Email:</label>                         
                        <input type="text" class="form-control">
                    </div>

                    <div class="input-group mb-3 input-group-sm">
                        <label>Password:</label> 
                        <input type="text" class="form-control">
                    </div>
                </div>

                <!-- model footer -->
                <div class="modal-footer">
                    <button class="btn btn-primary" type="button" data-bs-dismiss="modal">Sign In</button>
                    <button class="btn btn-warning" type="button" data-bs-dismiss="modal">Sign Up</button>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
