<html>
    <head>
        <title>Bootstrap Example</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="desktop.css">
    </head>
    <body>
        <div class="container pt-5 bg-info text-white">
            <h1 class="text-primary">This is my first bootstrap page</h1>
            <p class="bg-success text-warning">This is my paragraph tag</p>
            <p class="bg-info text-warning">This is my another paragraph</p>
            <div class="input-group mb-3 input-group-sm">
                <input type="text" class="form-control">
            </div>
            <div class="input-group mb-3 input-group-sm">
                <input type="text" class="form-control">
            </div>
            <div class="input-group mb-3 input-group-sm">
                <input type="text" class="form-control">
            </div>

            <div class="input-group mb-3 input-group-sm">
                <select class="form-control">
                    <option value="">Select a car Model</option>
                    <option value="honda">Honda</option>
                    <option value="Audi">Audi</option>
                    <option value="bmw">BMW</option>
                </select>
            </div>

            <div class="spinner-border"></div>
            <!-- Task 1 Add another spinner with a different color -->
            <div class="spinner-border text-warning"></div>

             <!-- Task 2 try to implement the boostrap progress bar from the documentation -->
            <div class="progress mb-3" >
                <div class="progress-bar" style="width:50%"></div>
            </div>

            <button class="btn btn-outline-primary">Click Me</button>
            <button class="btn btn-secondary">Click Me</button>
            <button class="btn btn-warning">Sign In</button>
            <button>Simple Button</button>
            <button class="btn">Basic Bootstrap</button>
        </div>
    </body>
</html>
