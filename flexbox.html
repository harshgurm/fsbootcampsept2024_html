<html>
    <head>
        <title>Flexbox</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            .flex-container {
                display: flex;
                background-color: aqua;
                flex-direction: row;
                gap: 2px;               
            }
            .flex-container > div {
                background-color: pink;
                /* margin: 10px; */
                border: 1px solid red;
            }

            @media (max-width:800px) {
                .flex-container {
                    display: flex;
                    background-color: aqua;
                    flex-direction: column;
                    gap: 5px;               
                }   
            }
        </style>
    </head>
    
    <body>
        <div class="flex-container">
            <div>Home</div>
            <div>Contact Me</div>
            <div>About Me</div>
        </div>
    </body>
</html>
